{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Проверка #{{ job.id }} <span class="muted" id="st">{{ job.status }}</span></h2>
  <div class="muted">создана {{ job.created_at|dt }} · запросил: {{ job.requested_by }}</div>
  <div class="progress"><div id="bar"></div></div>
  <div id="cnt" class="muted">{{ job.done }} / {{ job.total }}</div>
  <div class="actions"><a class="btn secondary" href="/">← к списку</a></div>
</div>
<div class="card">
  <table id="tbl">
    <tr><th></th><th>IP</th><th>Имя</th><th>SSH</th><th>Прокси</th><th>Задержка</th></tr>
  </table>
</div>
<script>
const id = {{ job.id }};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function tick(){
  const r = await fetch('/jobs/'+id+'/json'); if(!r.ok) return;
  const j = await r.json();
  document.getElementById('st').textContent = j.status;
  document.getElementById('cnt').textContent = j.done+' / '+j.total;
  document.getElementById('bar').style.width = (j.total? Math.round(100*j.done/j.total):0)+'%';
  const t = document.getElementById('tbl');
  while(t.rows.length>1) t.deleteRow(1);
  for(const x of j.results){
    const tr = t.insertRow();
    tr.innerHTML = '<td><span class="dot '+esc(x.state)+'"></span></td><td><a href="/node/'+esc(x.ip)+'"><code>'+esc(x.ip)+'</code></a></td><td>'+esc(x.name)+'</td><td>'+esc(x.ssh_status)+'</td><td>'+esc(x.proxy_status||'—')+'</td><td>'+(x.latency_ms==null?'—':x.latency_ms+' мс')+'</td>';
  }
  if(j.status!=='done') setTimeout(tick, 2000);
}
tick();
</script>
{% endblock %}
