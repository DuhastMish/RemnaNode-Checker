services:
  app:
    build: .
    container_name: nodecheck
    network_mode: host          # wg0 поднимается в сетевом пространстве хоста
    cap_add: [NET_ADMIN]
    env_file: .env
    volumes:
      - ./data:/data
      - ./wireguard:/etc/wireguard
    restart: unless-stopped

  ttyd:
    build: .
    container_name: nodecheck-ttyd
    network_mode: host
    # TTYD_IFACE=lo  — режим SSH-туннеля: ttyd слушает 127.0.0.1, наружу уходит через ssh -R
    # TTYD_IFACE=wg0 — режим WireGuard: слушает только на туннельном интерфейсе
    # Внутри открывает ssh на сам хост панели (127.0.0.1 = хост, т.к. network_mode: host).
    command: >
      ttyd -p 7681 -i ${TTYD_IFACE:-lo} -b /ttyd -W
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${TTYD_USER:?set TTYD_USER in .env}@127.0.0.1
    depends_on: [app]
    restart: unless-stopped

  # HTTPS для ADMIN_HOST и STATUS_HOST: сертификаты Let's Encrypt получает сам, хранит в томе caddy_data.
  # Нужны A-записи обоих доменов на IP этой машины, свободный порт 80 и HTTPS_PORT (по умолчанию 443).
  # Включается профилем: COMPOSE_PROFILES=caddy в .env (панель дома за туннелем — оставить пустым).
  caddy:
    image: caddy:2.10-alpine
    container_name: nodecheck-caddy
    profiles: [caddy]
    network_mode: host          # проксирует на 127.0.0.1:8000 (панель) и 127.0.0.1:7681 (терминал)
    environment:
      ADMIN_HOST: ${ADMIN_HOST:-}
      STATUS_HOST: ${STATUS_HOST:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
